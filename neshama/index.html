<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח נשמה</title>
<link rel="icon" href="../icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* מסך לוח נשמה – אפליקציה נפרדת מלוח הזמנים. הכתובת: .../neshama/?shul=<מזהה>  (הדגמה: ?shul=demo) */
:root{--u:min(1vw,1.7778vh)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;cursor:none}
body{display:flex;align-items:center;justify-content:center;font-family:'Frank Ruhl Libre','David',serif}
.stage{position:relative;width:calc(var(--u)*100);height:calc(var(--u)*56.25);display:flex;flex-direction:column;gap:calc(var(--u)*1.2);padding:calc(var(--u)*1.8) calc(var(--u)*2.4) calc(var(--u)*1.4)}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:calc(var(--u)*2)}
.dp{position:relative;text-align:center;padding:calc(var(--u)*.6) calc(var(--u)*1.6);justify-self:start;min-width:calc(var(--u)*17)}
.dp.l{justify-self:end}
.dp .s{font-family:Heebo,Arial,sans-serif;font-weight:600;font-size:calc(var(--u)*1.35)}
.dp .b{font-weight:900;font-size:calc(var(--u)*2.4);line-height:1.15;white-space:nowrap}
.title{position:relative;text-align:center;padding:calc(var(--u)*.5) calc(var(--u)*5)}
.title .t{font-weight:900;font-size:calc(var(--u)*3.6);line-height:1.1;white-space:nowrap}
.title .st{font-family:Heebo,Arial,sans-serif;font-weight:600;font-size:calc(var(--u)*1.5);margin-top:calc(var(--u)*.2);white-space:nowrap}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) calc(var(--u)*26);gap:calc(var(--u)*1.6)}
.main.noweek{grid-template-columns:minmax(0,1fr)}
.main.noweek .week{display:none}
.left{display:flex;flex-direction:column;gap:calc(var(--u)*1.1);min-height:0;min-width:0}
/* היום */
.today{position:relative;display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*1) calc(var(--u)*2);min-height:calc(var(--u)*9)}
.today .tx{flex:1;min-width:0}
.today .tx + .tx{padding-right:calc(var(--u)*2)}
.today .lbl{font-family:Heebo,Arial,sans-serif;font-weight:800;font-size:calc(var(--u)*1.4);letter-spacing:.02em}
.today .nm{font-weight:900;font-size:calc(var(--u)*2.9);line-height:1.15}
.today .d{font-family:Heebo,Arial,sans-serif;font-size:calc(var(--u)*1.3);margin-top:calc(var(--u)*.2)}
.today.many .nm{font-size:calc(var(--u)*2.2)}
.today.empty .nm{font-size:calc(var(--u)*2.4)}
/* הלוח */
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(var(--u)*.9);align-content:start;transition:opacity .6s}
.board.fade{opacity:0}
.pl{position:relative;display:flex;align-items:center;gap:calc(var(--u)*.6);padding:calc(var(--u)*.5) calc(var(--u)*1);min-width:0}
.pl .tx{flex:1;min-width:0;text-align:center}
.pl .n{font-weight:700;font-size:calc(var(--u)*1.45);line-height:1.15}
.pl .n2{font-weight:500;font-size:calc(var(--u)*1.15);line-height:1.15}
.pl .dt{font-family:Heebo,Arial,sans-serif;font-size:calc(var(--u)*1.1);margin-top:calc(var(--u)*.15);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager{font-family:Heebo,Arial,sans-serif;font-size:calc(var(--u)*1.2);text-align:center;min-height:calc(var(--u)*1.6)}
/* השבוע */
.week{display:flex;flex-direction:column;padding:calc(var(--u)*1.1) calc(var(--u)*1.4);min-height:0;overflow:hidden}
.week h3{font-weight:900;font-size:calc(var(--u)*2);text-align:center;padding-bottom:calc(var(--u)*.6);margin-bottom:calc(var(--u)*.4)}
.wr{display:grid;grid-template-columns:calc(var(--u)*9.4) minmax(0,1fr);gap:calc(var(--u)*.7);padding:calc(var(--u)*.55) calc(var(--u)*.5);align-items:baseline}
.wr .dy{font-family:Heebo,Arial,sans-serif;font-weight:600;font-size:calc(var(--u)*1.2);white-space:nowrap}
.wr .nm{font-weight:700;font-size:calc(var(--u)*1.5);line-height:1.25}
.wr .nm div + div{margin-top:calc(var(--u)*.2)}
.wr.past{opacity:.5}
.foot{font-family:Heebo,Arial,sans-serif;font-weight:600;font-size:calc(var(--u)*1.35);text-align:center}
.foot:empty{display:none}
/* נר / מנורה */
.lamp{flex:none;position:relative;width:calc(var(--u)*2.6);height:calc(var(--u)*6)}
.lamp .w{position:absolute;bottom:0;left:22%;right:22%;height:58%;border-radius:calc(var(--u)*.3) calc(var(--u)*.3) calc(var(--u)*.15) calc(var(--u)*.15)}
.lamp .f{position:absolute;bottom:58%;left:50%;width:46%;height:38%;transform:translateX(-50%);border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
  background:radial-gradient(ellipse at 50% 72%,#fff8d8 0 18%,#ffd36b 38%,#ff9a2a 70%,rgba(255,120,30,0) 72%);
  box-shadow:0 0 calc(var(--u)*1.6) calc(var(--u)*.4) rgba(255,190,80,.55);animation:fl 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes fl{0%,100%{transform:translateX(-50%) scale(1,1) rotate(-1deg)}35%{transform:translateX(-50%) scale(.94,1.06) rotate(1.5deg)}70%{transform:translateX(-50%) scale(1.04,.96) rotate(-.5deg)}}
.pl .bulb{flex:none;width:calc(var(--u)*1.7);height:calc(var(--u)*1.7);border-radius:50%}
.notice{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;white-space:pre-line;font-family:Heebo,Arial,sans-serif;font-size:calc(var(--u)*2.6);line-height:1.6;padding:calc(var(--u)*6);z-index:5}
.notice.on{display:flex}
body.boot .stage > *:not(.notice){visibility:hidden}

/* ===== עיצוב מסורתי: עץ ופליז ===== */
body.wood{color:#3a2507;background:#2a160a;
 background-image:repeating-linear-gradient(92deg,rgba(0,0,0,.18) 0 2px,transparent 2px 9px),repeating-linear-gradient(88deg,rgba(255,200,140,.05) 0 1px,transparent 1px 23px),
  linear-gradient(90deg,#3b1f0e,#5a3218 20%,#4a2812 45%,#62391c 70%,#3b1f0e)}
body.wood .stage{border:calc(var(--u)*.9) solid #2b170a;box-shadow:inset 0 0 0 calc(var(--u)*.3) #a87a2c,inset 0 0 calc(var(--u)*4) rgba(0,0,0,.6)}
body.wood .brass{background:linear-gradient(160deg,#8a6220 0%,#d9b05a 18%,#f6dc8e 32%,#c4973f 52%,#e9c877 70%,#9b7026 100%);border-radius:calc(var(--u)*.35);
 box-shadow:0 calc(var(--u)*.25) calc(var(--u)*.5) rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,240,190,.55),inset 0 0 0 calc(var(--u)*.25) rgba(120,80,20,.35);text-shadow:0 1px 0 rgba(255,240,200,.6)}
body.wood .brass::before,body.wood .brass::after{content:'';position:absolute;top:calc(var(--u)*.4);width:calc(var(--u)*.5);height:calc(var(--u)*.5);border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#8a6220 70%)}
body.wood .brass::before{right:calc(var(--u)*.45)}
body.wood .brass::after{left:calc(var(--u)*.45)}
body.wood .pl.brass::before,body.wood .pl.brass::after{top:50%;margin-top:calc(var(--u)*-.25)}
body.wood .today{background:linear-gradient(180deg,rgba(20,10,4,.55),rgba(20,10,4,.35));border:1px solid rgba(232,196,120,.45);border-radius:calc(var(--u)*.6);color:#f6dc8e;text-shadow:0 1px 2px #000}
body.wood .today .d{color:#e8cfa0}
body.wood .today .tx + .tx{border-right:1px solid rgba(232,196,120,.35)}
body.wood .lamp .w{background:linear-gradient(90deg,#c9a65a,#fff1c8 45%,#b88d3c)}
body.wood .pl .bulb{background:radial-gradient(circle at 40% 35%,#6b5a3a,#2d2214 70%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
body.wood .pl.wk .bulb{background:radial-gradient(circle at 45% 40%,#fffbe6,#ffd35a 35%,#ff9e1f 70%,#a35a00);box-shadow:0 0 calc(var(--u)*1.2) calc(var(--u)*.35) rgba(255,190,60,.85)}
body.wood .pl.td{outline:calc(var(--u)*.25) solid #ffd35a;outline-offset:calc(var(--u)*.15)}
body.wood .pl .dt{color:#5a3a0c}
body.wood .week{background:rgba(20,10,4,.45);border:1px solid rgba(232,196,120,.45);border-radius:calc(var(--u)*.6);color:#f6dc8e}
body.wood .week h3{border-bottom:1px solid rgba(232,196,120,.4);text-shadow:0 1px 2px #000}
body.wood .wr{border-bottom:1px solid rgba(232,196,120,.13)}
body.wood .wr .dy{color:#e8cfa0}
body.wood .wr.now{background:rgba(255,211,90,.16);border-radius:calc(var(--u)*.4)}
body.wood .pager,body.wood .foot{color:#e8cfa0;text-shadow:0 1px 2px #000}
body.wood .notice{background:#2a160a;color:#f6dc8e}

/* ===== עיצוב כהה וזהב (כמו מסך הזמנים) ===== */
body.dark{color:#f3ead6;background:radial-gradient(ellipse at 50% 0%,#16274a,#0b1730 60%,#070f22)}
body.dark .dp,body.dark .title{color:#e2b857}
body.dark .dp .s,body.dark .title .st{color:#b9ad92}
body.dark .title .t{text-shadow:0 0 calc(var(--u)*2) rgba(226,184,87,.3)}
body.dark .today{background:linear-gradient(90deg,rgba(226,184,87,.16),rgba(226,184,87,.05));border:1px solid rgba(226,184,87,.45);border-radius:calc(var(--u)*.8)}
body.dark .today .lbl{color:#e2b857}
body.dark .today .d{color:#b9ad92}
body.dark .today .tx + .tx{border-right:1px solid rgba(226,184,87,.3)}
body.dark .lamp .w{background:linear-gradient(90deg,#d8cfb8,#fffaf0 45%,#cfc4a8)}
body.dark .pl{background:rgba(255,255,255,.045);border:1px solid rgba(226,184,87,.18);border-radius:calc(var(--u)*.5)}
body.dark .pl .bulb{display:none}
body.dark .pl.wk{border-color:#e2b857;background:rgba(226,184,87,.1)}
body.dark .pl.wk .bulb{display:block;width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);background:radial-gradient(circle,#fff2c0,#ffb53a 55%,rgba(255,150,40,0) 72%)}
body.dark .pl.td{background:rgba(226,184,87,.2)}
body.dark .pl .dt{color:#b9ad92}
body.dark .week{background:rgba(255,255,255,.04);border:1px solid rgba(226,184,87,.25);border-radius:calc(var(--u)*.8)}
body.dark .week h3{color:#e2b857;border-bottom:1px solid rgba(226,184,87,.3)}
body.dark .wr{border-bottom:1px solid rgba(226,184,87,.1)}
body.dark .wr .dy{color:#b9ad92}
body.dark .wr.now{background:rgba(226,184,87,.14);border-radius:calc(var(--u)*.4)}
body.dark .wr.now .nm{color:#f2cf78}
body.dark .pager,body.dark .foot{color:#b9ad92}
body.dark .notice{background:#0b1730;color:#f3ead6}
</style>
</head>
<body class="wood boot">
<div class="stage">
  <header>
    <div class="dp brass"><div class="s" id="dayName"></div><div class="b" id="hDate"></div></div>
    <div class="title brass"><div class="t" id="title">לוח נשמה</div><div class="st" id="sub"></div></div>
    <div class="dp l brass"><div class="s">תאריך לועזי</div><div class="b" id="gDate"></div></div>
  </header>
  <div class="main" id="main">
    <div class="left">
      <div class="today" id="today"></div>
      <div class="board" id="board"></div>
      <div class="pager" id="pager"></div>
    </div>
    <div class="week"><h3>יארצייטים השבוע</h3><div id="week"></div></div>
  </div>
  <div class="foot" id="foot"></div>
  <div class="notice" id="notice"></div>
</div>
<script src="heb.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzk_q8nwWNNXzr2UYee4WPWa0k6D-ZGegG16g5KFU46jew3l_bKigET6eW7-cLwTVklyg/exec';
const Q = new URLSearchParams(location.search);
const SHUL = (Q.get('shul') || '').trim().toLowerCase();
const SUPPORT = '052-8703357';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const DAYS = ['יום ראשון','יום שני','יום שלישי','יום רביעי','יום חמישי','יום שישי','שבת קודש'];
const DAYS_S = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','שבת'];
// מזהה מסך (משותף לאתר – אותו מזהה כמו במסך הזמנים, אבל נרשם בנפרד כ"לוח נשמה")
const DEVICE = (() => {
  let id = null; try{ id = localStorage.getItem('device_id'); }catch(e){}
  if(!id){ id = Array.from(crypto.getRandomValues(new Uint8Array(10)), b => b.toString(16).padStart(2,'0')).join(''); try{ localStorage.setItem('device_id', id); }catch(e){} }
  let h = 0; for(const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 9000;
  return {id, code: String(1000 + h)};
})();

let DATA = null, PAGE = 0, PAGES = [], rotTimer = null, lastKey = '';
function notice(t){ $('notice').textContent = t || ''; $('notice').classList.toggle('on', !!t); if(t) document.body.classList.remove('boot'); }

// ---------- זמן מקומי של בית הכנסת ----------
function localNow(tz){
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone: tz, hourCycle:'h23', year:'numeric', month:'numeric', day:'numeric', hour:'numeric', minute:'numeric'})
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  const y = +p.year, m = +p.month, d = +p.day, min = (+p.hour % 24) * 60 + +p.minute;
  const off = Math.round((Date.UTC(y, m - 1, d, Math.floor(min / 60), min % 60) - Math.floor(Date.now() / 60000) * 60000) / 60000);   // הפרש מ-UTC בדקות
  return {y, m, d, min, off};
}
// ---------- פענוח שורת נפטר מהקובץ ----------
function parseFix(s){
  const t = String(s || '').trim().split(/\s+/); if(t.length < 2) return null;
  const d = HEB.ungem(t[0]), m = HEB.monthOf(t.slice(1).join(' '));
  return d >= 1 && d <= 30 && m ? {d, m} : null;
}
function person(o){
  let d = HEB.ungem(o.d), m = HEB.monthOf(o.m), y = HEB.yearOf(o.y);
  const g = String(o.g || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(!(d >= 1 && d <= 30 && m && y > 3000) && g){ const h = HEB.fromGreg(+g[1], +g[2], +g[3], o.as === 'כן'); d = h.d; m = h.m; y = h.y; }
  const ok = d >= 1 && d <= 30 && m >= 1 && m <= 13 && y > 3000;
  if(ok && m === 13 && !HEB.leap(y)) m = 12;
  return {name: String(o.n || '').trim(), title: String(o.t || '').trim(), note: String(o.note || '').trim(), ok, d, m, y, fix: parseFix(o.fix)};
}
const full = p => p.name + (p.title ? '\u00a0' + p.title : '');   // רווח קשיח – שה"ז״ל" לא יישאר לבד בשורה
const deathTxt = p => p.ok ? HEB.fmt({d: p.d, m: p.m, y: p.y}, true) : '';
const yzOrder = p => { if(!p.ok) return 9999; const m = p.fix ? p.fix.m : p.m; return (m >= 7 ? m - 7 : m + 6) * 31 + (p.fix ? p.fix.d : p.d); };   // סדר בשנה מתשרי

// ---------- תצוגה ----------
function render(force){
  if(!DATA) return;
  const S = DATA.set || {}, P = DATA.place || {}, tz = P.tz || 'Asia/Jerusalem';
  const now = localNow(tz), civ = HEB.gAbs(now.y, now.m, now.d);
  const sunset = HEB.sunset(now.y, now.m, now.d, P.lat || 31.778, P.lon || 35.235, now.off);
  const today = civ + (now.min >= sunset ? 1 : 0);   // אחרי השקיעה – כבר היום העברי הבא
  const adar = S.adar === '1' || S.adar === '2' ? S.adar : (/מזרח/.test(P.nusach || '') ? '2' : '1');
  const key = today + '|' + JSON.stringify(DATA);
  if(!force && key === lastKey) return;
  lastKey = key;
  document.body.className = (S.theme === 'dark' ? 'dark' : 'wood');
  const hT = HEB.fromAbs(today);
  $('dayName').textContent = (today > civ ? 'אור ל' : '') + DAYS[HEB.dow(today)];
  $('hDate').textContent = HEB.fmt(hT, true);
  $('gDate').textContent = now.d + '.' + now.m + '.' + now.y;
  $('title').textContent = S.title || 'לוח נשמה';
  $('sub').textContent = S.sub || DATA.name || '';
  $('foot').textContent = S.footer || '';
  const week = S.week !== 'לא';
  $('main').classList.toggle('noweek', !week);

  const list = (DATA.list || []).map(person).filter(p => p.name);
  const ws = today - HEB.dow(today), we = ws + 6;   // ראשון עד שבת
  list.forEach(p => { p.yz = p.ok ? HEB.yahrzeitIn(p, ws, we, adar) : null; });
  // היום
  const tod = list.filter(p => p.yz === today);
  const tb = $('today'); tb.className = 'today';
  if(tod.length){
    tb.classList.toggle('many', tod.length > 2);
    tb.innerHTML = '<div class="lamp"><div class="f"></div><div class="w"></div></div>' + tod.slice(0, 3).map((p, i) =>
      `<div class="tx">${i ? '' : `<div class="lbl">יום הזיכרון היום · ${esc(HEB.fmt(hT))}</div>`}<div class="nm">${esc(full(p))}</div><div class="d">נלב״ע ${esc(deathTxt(p))}${i === 0 && tod.length > 3 ? ' · ועוד ' + (tod.length - 3) : ''} · תנצב״ה</div></div>`).join('');
  } else {
    // אין היום – היארצייט הקרוב (עד 30 יום)
    let next = null, at = null;
    for(const p of list){ if(!p.ok) continue; const a = HEB.yahrzeitIn(p, today + 1, today + 30, adar); if(a !== null && (at === null || a < at)){ at = a; next = p; } }
    tb.classList.add('empty');
    tb.innerHTML = '<div class="lamp"><div class="f"></div><div class="w"></div></div>' + (next
      ? `<div class="tx"><div class="lbl">היארצייט הקרוב · ${DAYS[HEB.dow(at)]} ${esc(HEB.fmt(HEB.fromAbs(at)))}</div><div class="nm">${esc(full(next))}</div><div class="d">נלב״ע ${esc(deathTxt(next))}</div></div>`
      : `<div class="tx"><div class="nm">לזכרון עולם יהיה צדיק</div></div>`);
  }
  // השבוע
  if(week){
    let h = '';
    for(let a = ws; a <= we; a++){
      const ps = list.filter(p => p.yz === a);
      h += `<div class="wr${a < today ? ' past' : a === today ? ' now' : ''}"><div class="dy">${DAYS_S[a - ws]} · ${esc(HEB.fmt(HEB.fromAbs(a)))}</div><div class="nm">${ps.length ? ps.map(p => `<div>${esc(full(p))}</div>`).join('') : '—'}</div></div>`;
    }
    $('week').innerHTML = h;
  }
  // הלוח
  const per = [12, 16, 20, 24].includes(+S.perPage) ? +S.perPage : 16;
  const sorted = list.slice().sort((a, b) => S.order === 'abc' ? a.name.localeCompare(b.name, 'he') : (yzOrder(a) - yzOrder(b) || a.name.localeCompare(b.name, 'he')));
  PAGES = []; for(let i = 0; i < sorted.length; i += per) PAGES.push(sorted.slice(i, i + per));
  if(!PAGES.length) PAGES = [[]];
  if(PAGE >= PAGES.length) PAGE = 0;
  const rows = per / 4;
  $('board').style.gridTemplateRows = `repeat(${rows}, minmax(0,1fr))`;
  $('board').style.setProperty('--fs', 1);
  drawPage(today);
  clearInterval(rotTimer);
  const sec = Math.max(5, Math.min(120, parseInt(S.rotate, 10) || 12));
  if(PAGES.length > 1) rotTimer = setInterval(() => { $('board').classList.add('fade'); setTimeout(() => { PAGE = (PAGE + 1) % PAGES.length; drawPage(today); $('board').classList.remove('fade'); }, 600); }, sec * 1000);
  document.body.classList.remove('boot');
}
function drawPage(today){
  const pg = PAGES[PAGE] || [];
  $('board').innerHTML = pg.length ? pg.map(p => {
    const date = p.fix ? HEB.gem(p.fix.d) + ' ' + HEB.monthName(p.fix.m) : p.ok ? HEB.fmt({d: p.d, m: p.m, y: p.y}) : '';
    const long = full(p).length > 22;
    return `<div class="pl brass${p.yz !== null && p.yz !== undefined ? ' wk' : ''}${p.yz === today ? ' td' : ''}"><span class="bulb"></span><div class="tx"><div class="${long ? 'n2' : 'n'}">${esc(full(p))}</div>${date || p.note ? `<div class="dt">${esc([date, p.note].filter(Boolean).join(' · '))}</div>` : ''}</div></div>`;
  }).join('') : '<div class="pl brass" style="grid-column:1/-1"><div class="tx"><div class="n">עדיין לא נוספו שמות ללוח</div></div></div>';
  $('pager').textContent = PAGES.length > 1 ? `עמוד ${PAGE + 1} מתוך ${PAGES.length}` : '';
}

// ---------- טעינת הנתונים ----------
const DEMO = {ok: true, name: 'בית הכנסת – הדגמה', place: {lat: 31.778, lon: 35.235, tz: 'Asia/Jerusalem'},
  set: {theme: Q.get('theme') || 'wood', title: 'לוח נשמה', sub: '', footer: 'הנצחה בלוח – לפרטים אצל הגבאי', perPage: '16', rotate: '12', week: 'כן'}, list: []};
function demoList(){   // שמות בדויים, תאריכים סביב היום – כדי שיהיה מה לראות ב"היום" וב"השבוע"
  const names = ['ר׳ אברהם בן יוסף','שרה בת משה','ר׳ דוד בן חיים','רבקה בת יצחק','ר׳ משה בן אליהו','ר׳ שמואל בן נתן','לאה בת יעקב','ר׳ יעקב בן שלמה','מרים בת אהרן',
    'ר׳ יוסף בן מרדכי','חנה בת שמעון','ר׳ אהרן בן ישראל','רחל בת דוד','ר׳ חיים בן צבי','אסתר בת מנחם','ר׳ מנחם בן ברוך','דבורה בת אליעזר','ר׳ ברוך בן שמחה','יהודית בת נחום',
    'ר׳ אליעזר בן פנחס','ר׳ נחום בן זאב','בתיה בת אברהם','ר׳ פנחס בן יחיאל','צפורה בת יהושע','ר׳ זאב בן גדליה','ר׳ שמעון בן אשר','חיה בת מאיר','ר׳ מאיר בן עזריאל',
    'ר׳ ישראל בן אפרים','גיטל בת שלום','ר׳ אפרים בן לוי','ר׳ שלום בן עמרם'];
  const P = DEMO.place, now = localNow(P.tz), civ = HEB.gAbs(now.y, now.m, now.d);
  const today = civ + (now.min >= HEB.sunset(now.y, now.m, now.d, P.lat, P.lon, now.off) ? 1 : 0), ws = today - HEB.dow(today);
  const off = [today - ws, today - ws, 1, 3, 5, -1, 40, 80, 120, 160, 200, 240, 280, 320, 20, 60, 100, 140, 180, 220, 260, 300, 340, 30, 70, 110, 150, 190, 230, 270, 310, 350];
  return names.map((n, i) => {
    const h = HEB.fromAbs(ws + off[i] - (25 + i * 3) * 365);   // אותו יום בשנה, לפני 25+ שנים (בערך)
    const t = HEB.fromAbs(ws + off[i]), y = h.y;
    return {n, t: n.startsWith('ר׳') ? 'ז״ל' : 'ע״ה', d: HEB.gem(t.d), m: HEB.monthName(t.m === 13 && !HEB.leap(y) ? 12 : t.m), y: HEB.gem(y), note: i % 5 === 2 ? 'נתרם ע״י המשפחה' : ''};
  });
}
async function load(){
  if(!SHUL){ notice('לא הוגדר בית כנסת. יש להוסיף לכתובת: ?shul=מזהה'); return; }
  if(SHUL === 'demo'){ DEMO.list = demoList(); DATA = DEMO; if(Q.get('per')) DEMO.set.perPage = Q.get('per'); if(Q.get('week') === '0') DEMO.set.week = 'לא'; notice(''); render(true); return; }
  let j = null;
  try{
    const r = await fetch(`${API}?shul=${encodeURIComponent(SHUL)}&what=neshama&dev=${DEVICE.id}&code=${DEVICE.code}&t=${Date.now()}`, {cache:'no-store'});
    j = await r.json();
  }catch(e){}
  if(j && j.ok){ DATA = j; try{ localStorage.setItem('nesh_' + SHUL, JSON.stringify(j)); }catch(e){} notice(''); render(); return; }
  const err = j && j.err || '';
  if(/^ERR:DEVICE/.test(err)){ notice('מסך זה ממתין לאישור.\nקוד המסך: ' + DEVICE.code + '\nלאישור: ' + SUPPORT); return; }
  if(err === 'ERR:NESH_OFF'){ notice('לוח הנשמה עוד לא הופעל לבית הכנסת הזה.\nלפרטים: ' + SUPPORT); return; }
  if(err === 'ERR:NOT_FOUND'){ notice('בית הכנסת "' + SHUL + '" לא נמצא.\nיש לבדוק את הכתובת.'); return; }
  // אין חיבור – ממשיכים עם העותק האחרון
  if(!DATA){ try{ DATA = JSON.parse(localStorage.getItem('nesh_' + SHUL)); }catch(e){} }
  if(DATA) render(); else notice('אין חיבור לאינטרנט.\nהמסך ינסה שוב בעוד רגע.');
}
try{ const c = JSON.parse(localStorage.getItem('nesh_' + SHUL)); if(c && c.ok && SHUL !== 'demo'){ DATA = c; render(true); } }catch(e){}
load();
setInterval(load, (SHUL === 'demo' ? 60 : 5 * 60) * 1000);   // רענון הנתונים
setInterval(() => render(), 30 * 1000);                     // החלפת היום בשקיעה
// מסך מלא בלחיצה (במחשב בלי קיוסק)
document.addEventListener('click', () => { const el = document.documentElement; if(!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(()=>{}); });
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js', {scope: '../'}).catch(()=>{});
</script>
