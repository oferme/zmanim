<style>

.days .d.sh{color:var(--gold2);font-weight:900;border-color:var(--gold);background:rgba(226,184,87,.14)}

.black{position:fixed;inset:0;background:#000;z-index:50;display:none;align-items:flex-end;justify-content:center;padding-bottom:3vh;color:#333;font-size:1.6vh}
.black.on{display:flex}
.menu{position:fixed;inset:0;z-index:60;background:rgba(5,12,28,.82);display:none;align-items:center;justify-content:center}

.menu h2{font-size:calc(var(--u)*2.6);color:var(--gold2);font-weight:800}
.menu button{font-family:'Heebo',sans-serif;font-size:calc(var(--u)*2.4);font-weight:700;padding:calc(var(--u)*1.2);border-radius:calc(var(--u)*1);border:1px solid var(--gold);background:rgba(226,184,87,.15);color:var(--text);cursor:pointer}
.menu button:hover{background:rgba(226,184,87,.35)}
.menu .note{font-size:calc(var(--u)*1.6);color:#ff9e8a;min-height:1.2em}
.notice{white-space:pre-line;line-height:1.6;position:fixed;inset:0;z-index:55;background:var(--bg1);display:none;align-items:center;justify-content:center;text-align:center;padding:5vw;font-size:calc(var(--u)*3.2);font-weight:700;color:var(--gold2)}
.notice.on{display:flex}
.status{position:fixed;bottom:calc(var(--u)*.6);left:calc(var(--u)*1);font-size:calc(var(--u)*1.3);color:#ff9e8a}
#live{display:none;position:fixed;inset:0;background:#000;z-index:52}#live iframe{width:100%;height:100%;border:0}
#zoomBar{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--u)*1.2);padding:calc(var(--u)*.9) calc(var(--u)*2.4);border-radius:calc(var(--u)*1);background:linear-gradient(180deg,#f0cf7a,#d9a93f);color:#1a1405;font:800 calc(var(--u)*2.4) 'Heebo',sans-serif;box-shadow:0 0 calc(var(--u)*3) rgba(226,184,87,.45);z-index:40;white-space:nowrap}
#rotHint{display:none;position:fixed;left:0;right:0;bottom:0;padding:14px 16px;background:rgba(10,23,48,.95);border-top:1px solid var(--gold);color:var(--gold2);font:600 16px 'Heebo',sans-serif;text-align:center;z-index:50}

<body>
<div id="zoomBar"></div>
<div id="live"></div>
<div id="rotHint">לתצוגה מלאה – סובבו את המכשיר לרוחב ולחצו על המסך</div>
<div class="stage">
  <header>
    <div class="blk">
      <div class="small" id="dow">&nbsp;</div>
      <div class="big" id="hdate">&nbsp;</div>
    </div>
    <div class="blk left">
      <div class="small">תאריך לועזי</div>
      <div class="big" id="gdate">&nbsp;</div>
    </div>
  </header>
  <div class="center">
    <div class="slot side L" id="slotL"></div>
    <div class="slot side R" id="slotR"></div>
    <div class="clockrow">
      <div class="clock"><span id="hm">--:--</span><span class="sec" id="sec">--</span></div>
    </div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="mev" id="mev"></div>
  <div class="days" id="days"></div>
</div>
<div class="status" id="status"></div>
<div class="notice" id="notice"></div>
<div class="black" id="black"><span id="blackNote"></span></div>
<div class="menu" id="menu"><div class="box">
  <h2>תפריט מסך</h2>
  <button id="bBlack">מסך שחור</button>
  <button id="bExit">יציאה מהמסך (סגירה)</button>
  <button id="bCancel">ביטול</button>
  <div class="note" id="menuNote"></div>
</div></div>

<script>
// ===================== הגדרות מערכת =====================
// כתובת הסקריפט המרכזי (Google Apps Script) – אותה כתובת לכל בתי הכנסת
const API = 'https://script.google.com/macros/s/AKfycbzk_q8nwWNNXzr2UYee4WPWa0k6D-ZGegG16g5KFU46jew3l_bKigET6eW7-cLwTVklyg/exec';
// מזהה בית הכנסת מגיע מהכתובת: ...?shul=beit-el
const SHUL = (new URLSearchParams(location.search).get('shul') || '').trim().toLowerCase();
const MSG_URL = API;
// טלפון ליצירת קשר שמופיע על מסך שלא אושר
const SUPPORT = '052-8703357';
// מזהה ייחודי לכל מחשב/מסך + קוד קצר להצגה
const DEVICE = (() => {
  let id = null; try{ id = localStorage.getItem('device_id'); }catch(e){}
  if(!id){ id = Array.from(crypto.getRandomValues(new Uint8Array(10)), b => b.toString(16).padStart(2,'0')).join(''); try{ localStorage.setItem('device_id', id); }catch(e){} }
  let h = 0; for(const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 9000;
  return {id, code: String(1000 + h)};
})();
const MY_VER = (location.pathname.match(/\/v(\d+)\//) || [])[1] || null;   // הגרסה של הקובץ הזה (לפי התיקייה)
let TZ = 'Asia/Jerusalem';
// הגדרות בית הכנסת – נקראות משורות שמתחילות ב-! במסמך של בית הכנסת
let CFG = {};
// תוכן משבצת: "דף יומי", "הודעות", "זמני היום", "זמני תפילות", "ריק". כמה תכנים בפסיקים = מתחלפים
function slotList(v){
  return v.split(/[,،]/).map(x => x.trim()).filter(Boolean).map(x =>
    /לימוד/.test(x) ? 'learn' : /בתפילה|הזכרות/.test(x) ? 'tefila' : /דף/.test(x) ? 'daf' : /הודע/.test(x) ? 'msgs' : /תפיל/.test(x) ? 'prayers' : /זמני|זמנים/.test(x) ? 'zmanim' : 'none');
}
function parseSettings(text){
  const c = {};
  for(const line of (text||'').split(/\r?\n/)){
    const m = line.match(/^\s*!\s*([^:=]+?)\s*[:=]\s*(.*?)\s*$/); if(!m) continue;
    const k = m[1].replace(/\s+/g,' '), v = m[2];
    if(/לימוד יומי/.test(k)) c.learn = v.split(/[,\s]+/).filter(x => LEARN_DEF[x]);
    else if(/^תחנון/.test(k)) c.tachanun = !/^(לא|no|0)/i.test(v);
    else if(/ספירת העומר/.test(k)) c.omerB = /בעומר/.test(v);
    else if(/כותרת ברכה/.test(k)) c.mazalTitle = v;
    else if(/^מזל טוב/.test(k)){   // ! מזל טוב 2026-10-25 2026-10-31: הטקסט
      const d = k.match(/(\d{4}-\d{2}-\d{2})(?:\s+(\d{4}-\d{2}-\d{2}))?/);
      if(d && v) (c.mazal = c.mazal || []).push({from: d[1], to: d[2] || d[1], text: v});
    }
    else if(/כותרת זום/.test(k)) c.zoomTitle = v;
    else if(/שיעור זום/.test(k)){   // "ה 21:00-22:00" (ש = שבת / מוצאי שבת)
      const m2 = v.match(/^([אבגדהוש])\S*\s+(\d{1,2}:\d{2})(?:\s*-\s*(\d{1,2}:\d{2}))?/);
      if(m2) (c.zoom = c.zoom || []).push({d: 'אבגדהוש'.indexOf(m2[1]), t: m2[2], e: m2[3] || ''});
    }
    else if(/שידור יוטיוב/.test(k)) c.youtube = v;
    else if(/^שם/.test(k)) c.name = v;
    else if(/מזהה מיקום|geonameid/i.test(k)) c.geonameid = (v.match(/\d+/)||[])[0];
    else if(/קואורדינטות|קווי|מיקום/.test(k)){ const n = v.match(/-?\d+(\.\d+)?/g); if(n && n.length>=2){ c.lat = n[0]; c.lon = n[1]; } }
    else if(/אזור זמן/.test(k)) c.tz = v;
    else if(/^גובה/.test(k)) c.elev = (v.match(/\d+/)||[])[0];
    else if(/שקיעה לפי גובה/.test(k)) c.useElev = !/^(לא|no|0)/i.test(v);
    else if(/הדלקת נרות/.test(k)) c.candleMin = (v.match(/\d+/)||[])[0];
    else if(/צאת שבת/.test(k)) c.havdalahMin = (v.match(/\d+/)||[])[0];
    else if(/^ישראל/.test(k)) c.israel = !/^(לא|no|0)/i.test(v);
    else if(/טבלת נץ/.test(k)) c.netzTable = v;
    else if(/גרסת מערכת/.test(k)) c.sysVer = (v.match(/\d+/)||[])[0];
    else if(/משבצת ימין/.test(k)) c.slotR = slotList(v);
    else if(/משבצת שמאל/.test(k)) c.slotL = slotList(v);
    else if(/משבצת תחתונה/.test(k)) c.slotB = slotList(v);
    else if(/גודל שעון/.test(k)) c.clock = +((v.match(/\d+/)||[100])[0]);
    else if(/גודל שורה תחתונה/.test(k)) c.bottom = +((v.match(/\d+/)||[90])[0]);
    else if(/החלפה/.test(k)) c.rotate = Math.max(5, +((v.match(/\d+/)||[30])[0]));
    else if(/^תפילה/.test(k)){
      const q = (k.match(/\[([^\]]+)\]/)||[])[1] || '';
      const label = k.replace(/^תפילה/,'').replace(/\[[^\]]*\]/,'').trim();
      (c.prayers = c.prayers || []).push({q: q.trim(), label, value: v});
    }
  }
  c.slotR = c.slotR || ['daf']; c.slotL = c.slotL || ['msgs']; c.slotB = c.slotB || ['zmanim'];
  c.clock = c.clock || 100; c.rotate = c.rotate || 30;
  c.bottom = Math.min(100, Math.max(60, c.bottom || 90));   // ברירת מחדל 90% – שלא ייגע במשבצות שבצדדים
  if(!c.geonameid && !c.lat) c.geonameid = '281184';            // ברירת מחדל: ירושלים
  if(!c.candleMin && c.geonameid === '281184') c.candleMin = '40';   // מנהג ירושלים
  if(c.useElev === undefined) c.useElev = !!(c.geonameid === '281184' || c.elev);
  if(c.israel === undefined) c.israel = true;
  if(c.tachanun === undefined) c.tachanun = true;
  c.learn = c.learn || [];
  if([c.slotR, c.slotL, c.slotB].some(a => a.includes('daf'))){   // "דף יומי" כמשבצת נפרדת הוחלף ב"לימוד יומי"
    ['slotR','slotL','slotB'].forEach(k => { c[k] = [...new Set(c[k].map(x => x === 'daf' ? 'learn' : x))]; });
    if(!c.learn.includes('daf')) c.learn = ['daf', ...c.learn];
  }
  return c;
}
const locQ = () => CFG.lat ? `latitude=${CFG.lat}&longitude=${CFG.lon}&tzid=${encodeURIComponent(TZ)}` : `geonameid=${CFG.geonameid}`;
const NETZ = { // לוחות חי – נץ החמה, רמת שלמה ירושלים, תשפ"ז
 5787: {

// ---- שבת מברכים: חישוב המולד (לפי החשבון המקובל, שעון ירושלים) ----
const REG  = ['Tishrei','Cheshvan','Kislev','Tevet',"Sh'vat",'Adar','Nisan','Iyyar','Sivan','Tamuz','Av','Elul'];
const LEAP = ['Tishrei','Cheshvan','Kislev','Tevet',"Sh'vat",'Adar I','Adar II','Nisan','Iyyar','Sivan','Tamuz','Av','Elul'];
const isLeap = y => ((7*y+1) % 19) < 7;
function moladText(hy, monthIdx){
  const months = Math.floor((235*hy - 234)/19) + monthIdx;
  const total = 31524 + months*765433;               // בהר״ד
  let day = Math.floor(total/25920) % 7, h = Math.floor((total%25920)/1080), p = total % 1080;
  const min = Math.floor(p/18), ch = p % 18;
  let clock, dayTxt;
  if(h < 6){ clock = h + 18; dayTxt = 'ליל ' + DAYS[day]; }   // הלילה שלפני היום
  else     { clock = h - 6;  dayTxt = 'יום ' + DAYS[day]; }
  const part = clock < 4 ? 'לפנות בוקר' : clock < 12 ? 'בבוקר' : clock < 18 ? 'אחר הצהריים' : 'בערב';
  const c12 = clock % 12 === 0 ? 12 : clock % 12;
  return `${dayTxt} בשעה <b>${c12}</b> ו-<b>${min}</b> דקות ו-<b>${ch}</b> חלקים ${part}`;
}
const HEB_M = {Tishrei:'תשרי',Cheshvan:'חשון',Kislev:'כסלו',Tevet:'טבת',"Sh'vat":'שבט',Adar:'אדר','Adar I':'אדר א׳','Adar II':'אדר ב׳',Nisan:'ניסן',Iyyar:'אייר',Sivan:'סיון',Tamuz:'תמוז',Av:'אב',Elul:'אלול'};
// שורת המולד: תמיד מוצגת. בשבוע של שבת מברכים (מיום ראשון) מתווספים "שבת מברכים" וימי ראש החודש
// אורך חודשים – חישוב לוח עברי מלא (לא תלוי באינטרנט)
function elapsed(y){ const m=Math.floor((235*y-234)/19), parts=12084+13753*m; let d=29*m+Math.floor(parts/25920); if((3*(d+1))%7<3) d++; return d; }
function delay(y){ const a=elapsed(y-1), b=elapsed(y), c=elapsed(y+1); return c-b===356 ? 2 : (b-a===382 ? 1 : 0); }
function yearLen(y){ return elapsed(y+1)+delay(y+1)-elapsed(y)-delay(y); }
function monthLen(y, hm){
  if(['Tishrei',"Sh'vat",'Adar I','Nisan','Sivan','Av'].includes(hm)) return 30;
  if(hm==='Cheshvan') return yearLen(y)%10===5 ? 30 : 29;
  if(hm==='Kislev')   return yearLen(y)%10===3 ? 29 : 30;
  return 29;
}
// ראש חודש היום? (ל׳ בחודש או א׳ בחודש, חוץ מראש השנה). מתחיל משקיעה
function roshChodeshToday(h){
  if(!h || (h.hd !== 30 && h.hd !== 1) || (h.hd === 1 && h.hm === 'Tishrei')) return '';
  let name = h.hm;
  if(h.hd === 30){ const list = isLeap(h.hy) ? LEAP : REG; const i = list.indexOf(h.hm); name = list[(i+1) % list.length]; }
  return `ראש חודש ${HEB_M[name]} – חודש טוב`;
}
// תקופת שבת מברכים: מיום ראשון של שבוע שבת מברכים ועד יום לפני ראש חודש
function mevarchimLine(H, dow0, base){
  if(!H || !H.hd || !H.hm || H.hm === 'Elul') return '';
  const L = monthLen(H.hy, H.hm);
  let smHd = 23; while(((smHd - H.hd - (6 - dow0)) % 7 + 7) % 7 !== 0) smHd++;   // תאריך שבת מברכים (כ״ג–כ״ט)
  if(H.hd < smHd - 6 || H.hd > 29) return '';
  let list = isLeap(H.hy) ? LEAP : REG, idx = list.indexOf(H.hm) + 1, y = H.hy;
  if(idx <= 0) return '';
  if(idx >= list.length){ y = H.hy + 1; idx = 0; list = isLeap(y) ? LEAP : REG; }
  const rcDates = L === 30 ? [addDays(base, 30-H.hd), addDays(base, 31-H.hd)] : [addDays(base, 30-H.hd)];
  const days = rcDates.map(d => DAYS[new Date(d+'T12:00:00Z').getUTCDay()]);
  const rcTxt = `ראש חודש ${HEB_M[list[idx]]} ` + (days.length > 1 ? `בימים <b>${days[0]}</b> ו<b>${days[1]}</b>` : `ביום <b>${days[0]}</b>`);
  const label = H.hd <= smHd ? '<b>שבת מברכים</b> · ' : '';
  return `${label}${rcTxt} · המולד: ${moladText(y, idx)}`;

  const slots = {R: CFG.slotR, L: CFG.slotL, B: CFG.slotB};
  const targets = ['L','R','B'].filter(k => slots[k].includes('msgs'));
  const msgs = (MSG_URL && curH) ? messagesBySide(targets) : {L:[],R:[],B:[]};
  // מזל טוב – מופיע בראש ההודעות בתאריכים שנקבעו
  const today = nowParts().date, mz = (CFG.mazal || []).filter(x => x.from <= today && today <= x.to);
  if(mz.length && targets.length){
    const side = targets.includes('L') ? 'L' : targets[0];
    msgs[side] = mz.map(x => ({body: x.text, mazal: true})).concat(msgs[side]);
  }
  const sec = Math.floor(Date.now() / 1000);
  for(const k of ['R','L','B']){
    const el = k === 'B' ? $('grid') : $('slot' + k);
    const items = slots[k].map(tp => content(tp, k, msgs[k])).filter(Boolean);
    const c = items.length ? items[Math.floor(sec / CFG.rotate) % items.length] : null;
    if(k === 'B') el.classList.toggle('many', !!(c && c.cards > 4));
    setSlot(el, c ? c.html : '', c && c.scroll);
  }
}
function setSlot(el, html, scroll){
  if(el._html === html){   // אותו תוכן – אבל אם בינתיים הוא גדל (גופנים נטענו וכו') ועכשיו לא נכנס, מתחילים לגלול
    if(scroll && !el._scrolling) startScroll(el);
    return;
  }
  el._html = html; el._scrolling = false; cancelAnimationFrame(el._raf);
  el.innerHTML = html;
  if(scroll) startScroll(el);
}
function startScroll(el){
  const vp = el.querySelector('.vp'), inner = el.querySelector('.in');
  if(!vp || !inner) return;
  const h = inner.scrollHeight;
  if(h <= vp.clientHeight + 2) return;                        // נכנס – בלי גלילה
  el._scrolling = true;
  vp.classList.add('scroll');
  const body = inner.innerHTML;
  inner.innerHTML = body + '<div class="gap"></div>' + body;   // גלילה רציפה כלפי מעלה
  const cycle = inner.scrollHeight - h;
  const speed = () => vp.clientHeight / 9;
  let off = 0, last = performance.now(), pause = last + 4000;
  const step = now => {
    const dt = (now - last) / 1000; last = now;
    if(now > pause){ off += speed() * dt; if(off >= cycle){ off -= cycle; pause = now + 4000; } }
    inner.style.transform = `translateY(${-off}px)`;
    el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}
function notice(txt){ $('blackNote').textContent = ''; $('notice').textContent = txt; $('notice').classList.toggle('on', !!txt); }
let booted = false, lastCfg = '';
async function loadMsgs(){
  if(!SHUL){ notice('לא הוגדר בית כנסת. יש להוסיף לכתובת: ?shul=מזהה'); return; }
  let text = null;
  try{
    const r = await fetch(`${API}?shul=${encodeURIComponent(SHUL)}&dev=${DEVICE.id}&code=${DEVICE.code}&t=${Date.now()}`, {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    text = await r.text();
    if(!/^ERR:/.test(text)){ try{ localStorage.setItem('msgs_' + SHUL, text); }catch(e){} }
  }catch(e){
    try{ text = localStorage.getItem('msgs_' + SHUL); }catch(_){}
  }
  if(text === null){ if(!booted) notice('אין חיבור לאינטרנט – מנסה שוב...'); return; }
  if(/^ERR:DEVICE/.test(text)){ notice('מסך זה ממתין לאישור.\nקוד המסך: ' + DEVICE.code + (SUPPORT && !/^PUT_/.test(SUPPORT) ? '\nלאישור: ' + SUPPORT : '')); return; }
  if(/^ERR:INACTIVE/.test(text)){ notice('המנוי של בית הכנסת אינו פעיל'); return; }
  if(/^ERR:/.test(text)){ notice('בית הכנסת "' + SHUL + '" לא נמצא במערכת'); return; }
  notice('');
  msgText = text;
  CFG = parseSettings(text); TZ = CFG.tz || 'Asia/Jerusalem';
  if(CFG.sysVer && MY_VER && CFG.sysVer !== MY_VER){ location.replace('../?shul=' + encodeURIComponent(SHUL)); return; }   // הוגדרה גרסה אחרת – עוברים אליה
  if(CFG.name) document.title = 'לוח זמנים – ' + CFG.name;
  const cfgKey = JSON.stringify(CFG);
  if(!booted || cfgKey !== lastCfg){ lastCfg = cfgKey; booted = true; load(); }   // הגדרות השתנו – טוען זמנים מחדש
  checkRemoteClose();
  const ck = document.querySelector('.clock'); if(ck) ck.style.fontSize = `calc(var(--u)*${(17*CFG.clock/100).toFixed(2)})`;
  $('grid').style.zoom = CFG.bottom / 100;
  renderSlots(); applyBlack();
}
loadMsgs(); setInterval(loadMsgs, 2*60*1000);   // בדיקה כל 2 דקות

// ---------- סגירת התוכנה מרחוק: שורה "סגור מסך" במסמך ההודעות ----------
// פועל רק כשהשורה נוספת בזמן שהמסך פתוח, כדי שפתיחה מחדש לא תיסגר מיד.
let prevClose = null;
function checkRemoteClose(){
  const has = msgText.split(/\r?\n/).some(l => !/^\s*#/.test(l) && l.trim() === 'סגור מסך');
  if(has && prevClose === false){
    window.close();
    setTimeout(() => { manualBlack = true; applyBlack(); }, 500);   // אם הסגירה לא הצליחה – מסך שחור
  }
  $('status').textContent = (has && prevClose === null) ? 'במסמך ההודעות כתוב "סגור מסך" – יש למחוק את השורה' : $('status').textContent;
  prevClose = has;
}

// ---------- כיבוי המסך: דאבל-קליק בעכבר, או מרחוק דרך מסמך ההודעות ----------
// במסמך ההודעות: שורה "מסך כבוי" → המסך משחיר. מוחקים את השורה → המסך חוזר.
let manualBlack = false, menuTimer = null, curTimer = null;
// "מסך כבוי" – אפשר להוסיף תאריך/שעות באותה שורה, למשל: "מסך כבוי 23:00-06:00"
const remoteBlack = () => {
  const n = nowParts(), now = `${n.h}:${n.m}`;
  return msgText.split(/\r?\n/).some(l => {
    if(/^\s*#/.test(l)) return false;
    const m = l.trim().match(/^מסך כבוי(.*)$/); if(!m) return false;
    const w = parseWhen(m[1], true);
    return w ? whenNow(w, curH, curH1, now) : true;
  });
};
function applyBlack(){
  const rb = !!MSG_URL && remoteBlack();
  $('black').classList.toggle('on', manualBlack || rb);
  $('blackNote').textContent = rb ? 'המסך כובה לפי השורה "מסך כבוי" במסמך ההודעות' : '';
}
function openMenu(){
  $('menuNote').textContent = '';
  $('bBlack').textContent = manualBlack ? 'החזרת המסך' : 'מסך שחור';
  $('menu').classList.add('on');
  clearTimeout(menuTimer); menuTimer = setTimeout(closeMenu, 15000);
}
function closeMenu(){ $('menu').classList.remove('on'); }
document.addEventListener('dblclick', e => { if(!$('menu').contains(e.target)) openMenu(); });
$('bCancel').onclick = closeMenu;
$('bBlack').onclick = () => { manualBlack = !manualBlack; applyBlack(); closeMenu(); };
$('bExit').onclick = () => {
  window.close();
  setTimeout(() => { $('menuNote').textContent = 'לא ניתן לסגור מכאן – יש ללחוץ Alt+F4 במקלדת'; }, 400);
};
document.addEventListener('mousemove', () => {           // סמן העכבר מופיע רק כשמזיזים אותו
  document.body.classList.add('cur');
  clearTimeout(curTimer); curTimer = setTimeout(() => document.body.classList.remove('cur'), 3000);
});

// הודעה במסך 10 דקות לפני שיעור בזום (ההצטרפות עצמה – ע"י zoom-helper.ps1 במחשב)
function zoomBar(n){
  const el = $('zoomBar'); if(!el) return;
  let txt = '';
  const dow = DOW_EN.indexOf(n.dow), cur = (+n.h)*60 + (+n.m);
  for(const z of (CFG.zoom || [])){
    if(z.d !== dow) continue;
    const [h,m] = z.t.split(':').map(Number), left = h*60 + m - cur;
    if(left > 0 && left <= 10) txt = `${CFG.zoomTitle || 'שיעור בזום'} – מתחיל בעוד ${left === 1 ? 'דקה' : left + ' דקות'}`;
    else if(left <= 0 && left > -2) txt = `${CFG.zoomTitle || 'שיעור בזום'} – מתחיל עכשיו`;
  }
  el.textContent = txt; el.style.display = txt ? 'block' : 'none';
}
// שידור יוטיוב – מוצג במסך עצמו בזמן השיעור
function ytEmbed(u){
  let m;
  if((m = u.match(/(?:youtu\.be\/|[?&]v=|\/(?:live|embed|shorts)\/)([\w-]{11})/))) return 'https://www.youtube.com/embed/' + m[1] + '?autoplay=1&rel=0&playsinline=1';
  if((m = u.match(/(?:\/channel\/|[?&]channel=)(UC[\w-]{22})/))) return 'https://www.youtube.com/embed/live_stream?channel=' + m[1] + '&autoplay=1&playsinline=1';
  return null;
}
function liveNow(n){   // השיעור שמתקיים עכשיו (כולל שיעור שעובר את חצות)
  const dow = DOW_EN.indexOf(n.dow), cur = (+n.h)*60 + (+n.m);
  const mins = t => { const [h,m] = t.split(':').map(Number); return h*60 + m; };
  return (CFG.zoom || []).find(z => {
    const st = mins(z.t), en = z.e ? mins(z.e) : (st + 90) % 1440;
    if(en > st) return z.d === dow && cur >= st && cur < en;
    return (z.d === dow && cur >= st) || ((z.d + 1) % 7 === dow && cur < en);
  });
}
let liveSrc = '';
function liveView(n){
  const src = (CFG.youtube && liveNow(n)) ? ytEmbed(CFG.youtube) : null, box = $('live');
  if((src || '') === liveSrc) return;
  liveSrc = src || '';
  box.innerHTML = src ? `<iframe src="${src}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>` : '';
  box.style.display = src ? 'block' : 'none';
}
function tick(){
  const n = nowParts();
  if(n.s === '00' || n.s === '30' || !$('live').dataset.init){ $('live').dataset.init = 1; liveView(n); }
  if(n.s === '00' || !$('zoomBar').dataset.init){ $('zoomBar').dataset.init = 1; zoomBar(n); }
  $('hm').textContent = `${n.h}:${n.m}`;
  $('sec').textContent = n.s;
  if(booted && n.date !== loadedFor) load();
  else if(n.s === '00') render();
  else renderSlots();
  if(n.h==='03' && n.m==='00' && n.s==='00') { if(navigator.onLine) location.reload(); }   // רענון יומי (רק כשיש אינטרנט)
}
setInterval(tick, 1000); tick();
setInterval(() => booted && load(), 3*60*60*1000);
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register(MY_VER ? '../sw.js' : 'sw.js', {scope: MY_VER ? '../' : './'}).catch(()=>{});   // עבודה גם בלי אינטרנט
document.addEventListener('click', () => {   // מסך מלא, ובטלפון/טאבלט – נעילה לרוחב
  const el = document.documentElement;
  if(!document.fullscreenElement && el.requestFullscreen)
    el.requestFullscreen().then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{});
});
</script>
